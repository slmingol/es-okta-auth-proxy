<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0C1524"/>
      <stop offset="100%" style="stop-color:#162035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A8A7C"/>
      <stop offset="100%" style="stop-color:#2BBFAD"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="12"/>

  <!-- Top accent bar -->
  <rect width="900" height="3" fill="url(#accent)" rx="0"/>

  <!-- Flow diagram: nodes + arrows -->
  <!-- User node -->
  <rect x="48" y="72" width="80" height="36" rx="6" fill="none" stroke="#2A4068" stroke-width="1.5"/>
  <text x="88" y="86" font-family="monospace" font-size="10" fill="#8AAAD0" text-anchor="middle">Browser</text>
  <text x="88" y="100" font-family="monospace" font-size="9" fill="#4A6A98" text-anchor="middle">/ client</text>

  <!-- Arrow 1 -->
  <line x1="130" y1="90" x2="162" y2="90" stroke="#4A6A98" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="146" y="84" font-family="monospace" font-size="8" fill="#4A6A98" text-anchor="middle">OIDC</text>

  <!-- Proxy node (accent) -->
  <rect x="164" y="66" width="108" height="48" rx="6" fill="#0A8A7C" fill-opacity="0.15" stroke="#0A8A7C" stroke-width="1.5"/>
  <text x="218" y="87" font-family="monospace" font-size="11" fill="#2BBFAD" text-anchor="middle" font-weight="bold">auth-proxy</text>
  <text x="218" y="103" font-family="monospace" font-size="9" fill="#0A8A7C" text-anchor="middle">Okta · :3344</text>

  <!-- Arrow 2 -->
  <line x1="274" y1="90" x2="306" y2="90" stroke="#4A6A98" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="290" y="84" font-family="monospace" font-size="8" fill="#4A6A98" text-anchor="middle">ApiKey</text>

  <!-- ES node -->
  <rect x="308" y="72" width="96" height="36" rx="6" fill="none" stroke="#2A4068" stroke-width="1.5"/>
  <text x="356" y="86" font-family="monospace" font-size="10" fill="#8AAAD0" text-anchor="middle">Elasticsearch</text>
  <text x="356" y="100" font-family="monospace" font-size="9" fill="#4A6A98" text-anchor="middle">ECK · Basic</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 Z" fill="#4A6A98"/>
    </marker>
  </defs>

  <!-- Divider -->
  <line x1="460" y1="40" x2="460" y2="160" stroke="#1E3050" stroke-width="1"/>

  <!-- Title + tagline -->
  <text x="500" y="80" font-family="monospace" font-size="26" fill="#D8E6F8" font-weight="bold" letter-spacing="-0.5">es-okta-auth-proxy</text>
  <text x="500" y="108" font-family="monospace" font-size="13" fill="#8AAAD0">Okta OIDC → Elasticsearch API key injection</text>
  <text x="500" y="130" font-family="monospace" font-size="12" fill="#4A6A98">SSO for ECK Basic — no Gold license required</text>

  <!-- Tag pills -->
  <rect x="500" y="145" width="58" height="18" rx="4" fill="#0A2030" stroke="#1E3050" stroke-width="1"/>
  <text x="529" y="158" font-family="monospace" font-size="9" fill="#2BBFAD" text-anchor="middle">Node 18+</text>

  <rect x="566" y="145" width="42" height="18" rx="4" fill="#0A2030" stroke="#1E3050" stroke-width="1"/>
  <text x="587" y="158" font-family="monospace" font-size="9" fill="#2BBFAD" text-anchor="middle">Docker</text>

  <rect x="616" y="145" width="34" height="18" rx="4" fill="#0A2030" stroke="#1E3050" stroke-width="1"/>
  <text x="633" y="158" font-family="monospace" font-size="9" fill="#2BBFAD" text-anchor="middle">MIT</text>
</svg>
